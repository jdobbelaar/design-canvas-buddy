AWSTemplateFormatVersion: "2010-09-09"

Description: >-
  The observability stack for design-canvas-buddy (OpenTelemetry Collector,
  Prometheus, Loki, Tempo, Grafana) on one small EC2 instance, separate from the
  application stacks. Dev and production send their telemetry here. Served over
  HTTPS by CloudFront: Grafana at the root, OTLP at /v1/*.

# One-time setup (needs IAM and Secrets Manager permissions the day-to-day deploy
# user does not keep: temporarily attach IAMFullAccess and SecretsManagerReadWrite,
# create the stack, then detach them):
#
#   aws cloudformation deploy --stack-name design-canvas-buddy-observability \
#     --template-file deploy/aws/observability.yaml --capabilities CAPABILITY_NAMED_IAM
#
# The stack only prepares the server (Docker, the repository). The stack itself
# is started by the "deploy observability" GitHub workflow (deploy-observability.yml),
# which also redeploys it whenever observability/ changes. Run it once after this.
#
# Then, in GitHub, create an environment named "observability" and give it the
# variables AWS_DEPLOY_ROLE_ARN (the DeployRoleArn output) and STACK_NAME.
#
# Logging in to Grafana: the user is "admin"; the password is generated by AWS and
# kept in Secrets Manager. Show it (it prints to your terminal) with:
#   aws secretsmanager get-secret-value --secret-id design-canvas-buddy/observability/grafana-admin \
#     --query SecretString --output text
#
# Applications send OTLP to the OtlpEndpoint output with the header
#   Authorization: Bearer <the ingest-token secret>
# deploy/aws/deploy.sh does this for the app servers.

Parameters:
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large]
    Description: >-
      t3.small (2 GB) is enough for a project this size (the stack idles at about
      0.7 GB; a swap file covers spikes). If it ever runs short of memory, use t3.medium.

  ServerName:
    Type: String
    Default: design-canvas-buddy-observability
    Description: >-
      The server's Name tag. The deploy role may only send commands to a server
      carrying it.

  GitRepo:
    Type: String
    Default: https://github.com/jdobbelaar/design-canvas-buddy.git
    Description: Public repository the configuration comes from.

  GitRef:
    Type: String
    Default: main
    Description: Branch, tag, or full commit SHA to check out when the server is first set up.

  SecretPrefix:
    Type: String
    Default: design-canvas-buddy/observability
    Description: >-
      Prefix of the two generated secrets (grafana-admin and ingest-token). The
      application servers' roles (github-oidc.yaml) read ingest-token by this name.

  GitHubSubject:
    Type: String
    Default: repo:jdobbelaar@7696911/design-canvas-buddy@1363452304
    Description: >-
      The repository part of the GitHub token subject; see the parameter of the
      same name in github-oidc.yaml.

  GitHubEnvironment:
    Type: String
    Default: observability
    Description: Only workflow jobs running in this GitHub environment may assume the deploy role.

  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: >-
      AWS's managed list of CloudFront's origin-facing addresses (this ID is for
      us-east-1; see cloudformation.yaml for how to find it elsewhere). The firewall
      admits traffic only from it, so the server can't be reached except through
      CloudFront.

  LatestUbuntuAmi:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id

Conditions:
  IsUsEast1: !Equals [!Ref AWS::Region, us-east-1]

Resources:
  # ---- Network: its own VPC, so this stack shares nothing with the applications.
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability }

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability }

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability-public }

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability-public }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet
      RouteTableId: !Ref RouteTable

  # CloudFront's address list counts as about 55 rules toward a security group's
  # limit of 60, so each port that CloudFront reaches gets a group of its own.
  # Prometheus, Loki, and Tempo are not published to the network at all.
  GrafanaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Grafana, from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: Grafana from CloudFront only
          IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability-grafana }

  OtlpSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: OTLP over HTTP, from CloudFront only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - Description: OTLP over HTTP from CloudFront only
          IpProtocol: tcp
          FromPort: 4318
          ToPort: 4318
          SourcePrefixListId: !Ref CloudFrontPrefixListId
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability-otlp }

  # ---- Secrets: generated by AWS, never in the repository or the template.
  GrafanaAdminSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${SecretPrefix}/grafana-admin
      Description: Grafana admin login (user "admin")
      GenerateSecretString:
        SecretStringTemplate: '{"username": "admin"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true # letters and digits only, safe in every config format

  IngestTokenSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${SecretPrefix}/ingest-token
      Description: Bearer token that applications present to send telemetry
      GenerateSecretString:
        PasswordLength: 48
        ExcludePunctuation: true

  # ---- The server's identity: receives deploy commands, reads its two secrets.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: design-canvas-buddy-observability-server
      Description: Lets the observability server receive deploy commands and read its secrets.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref GrafanaAdminSecret, !Ref IngestTokenSecret]

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: design-canvas-buddy-observability-server
      Roles: [!Ref InstanceRole]

  # The boot script reports to this handle when the server is ready to be deployed
  # to (or when setup fails), so the stack's result reflects it.
  WaitHandle:
    Type: AWS::CloudFormation::WaitConditionHandle

  WaitCondition:
    Type: AWS::CloudFormation::WaitCondition
    DependsOn: Instance
    Properties:
      Handle: !Ref WaitHandle
      Timeout: "1800"
      Count: 1

  Instance:
    Type: AWS::EC2::Instance
    # The boot script needs the internet (apt, git) straight away, and the role
    # needs its permissions before anything deploys.
    DependsOn: [DefaultRoute, SubnetRouteTableAssociation]
    Properties:
      ImageId: !Ref LatestUbuntuAmi
      InstanceType: !Ref InstanceType
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref PublicSubnet
      SecurityGroupIds: [!Ref GrafanaSecurityGroup, !Ref OtlpSecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 30
            VolumeType: gp3
            DeleteOnTermination: true
      MetadataOptions:
        HttpTokens: required
        HttpEndpoint: enabled
      Tags:
        - { Key: Name, Value: !Ref ServerName }
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euo pipefail

          # Tell CloudFormation how setup went.
          signal() {
            curl -sS -X PUT -H 'Content-Type:' \
              --data-binary "{\"Status\":\"$1\",\"Reason\":\"$2\",\"UniqueId\":\"observability\",\"Data\":\"$1\"}" \
              "${WaitHandle}" || true
          }
          trap 'signal FAILURE "setup failed at line $LINENO; see /var/log/cloud-init-output.log"' ERR

          # Spikes (a big query, a compaction) can briefly exceed a small instance's RAM.
          fallocate -l 2G /swapfile
          chmod 600 /swapfile
          mkswap /swapfile
          swapon /swapfile
          echo '/swapfile none swap sw 0 0' >> /etc/fstab

          export DEBIAN_FRONTEND=noninteractive
          # First boot can still be running unattended-upgrades; wait for its apt lock.
          apt-get -o DPkg::Lock::Timeout=300 update -y
          apt-get -o DPkg::Lock::Timeout=300 install -y docker.io docker-compose-v2 git curl

          # Cap container logs, or they slowly fill the disk.
          mkdir -p /etc/docker
          cat > /etc/docker/daemon.json <<'JSON'
          {"log-driver": "json-file", "log-opts": {"max-size": "10m", "max-file": "3"}}
          JSON
          systemctl enable --now docker

          mkdir -p /opt/observability
          cd /opt/observability
          git init -q
          git remote add origin "${GitRepo}"
          git fetch -q --depth 1 origin "${GitRef}"
          git checkout -q FETCH_HEAD

          # Nothing is started here: the deploy workflow starts the stack, because
          # it knows the public address Grafana needs and pulls the secrets.
          signal SUCCESS "ready to deploy"

  ElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: design-canvas-buddy-observability }

  ElasticIpAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      InstanceId: !Ref Instance
      AllocationId: !GetAtt ElasticIp.AllocationId

  # HTTPS on a *.cloudfront.net address with a real certificate. One address,
  # two origins on the same server: Grafana for everything, and the collector for
  # the OTLP paths (/v1/traces, /v1/metrics, /v1/logs). The leg from CloudFront
  # to the server is plain HTTP, as for the application (an EC2 hostname cannot
  # get a trusted certificate); the collector additionally demands the token.
  Distribution:
    Type: AWS::CloudFront::Distribution
    # The origin hostname is derived from the Elastic IP, so wait for it to be attached.
    DependsOn: ElasticIpAssociation
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: design-canvas-buddy-observability
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100
        Origins:
          - Id: grafana
            DomainName: !Sub
              - ec2-${DashedIp}.${Suffix}
              - DashedIp: !Join ["-", !Split [".", !Ref ElasticIp]]
                Suffix: !If [IsUsEast1, compute-1.amazonaws.com, !Sub "${AWS::Region}.compute.amazonaws.com"]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 3000
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
          - Id: otlp
            DomainName: !Sub
              - ec2-${DashedIp}.${Suffix}
              - DashedIp: !Join ["-", !Split [".", !Ref ElasticIp]]
                Suffix: !If [IsUsEast1, compute-1.amazonaws.com, !Sub "${AWS::Region}.compute.amazonaws.com"]
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 4318
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
        DefaultCacheBehavior:
          # Grafana: never cache. Forward everything, including the Host header
          # (Grafana rejects a login whose Origin does not match it) and the
          # WebSocket upgrade for live updates.
          TargetOriginId: grafana
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3 # Managed-AllViewer
          Compress: true
        CacheBehaviors:
          # Telemetry: never cache, and forward the Authorization header.
          - PathPattern: /v1/*
            TargetOriginId: otlp
            ViewerProtocolPolicy: https-only
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ---- Lets the observability GitHub environment deploy, and nothing else.
  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: design-canvas-buddy-github-deploy-observability
      Description: Assumed by GitHub Actions (OIDC) to deploy the observability stack.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exactly this repository AND this environment.
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubject}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AWS::StackName}/*
              - Sid: RunTheShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: OnlyOnTheObservabilityServer
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: !Ref ServerName
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: "*"

Outputs:
  GrafanaUrl:
    Description: Open this in a browser and log in as "admin" (see the header of this file).
    Value: !Sub https://${Distribution.DomainName}
  OtlpEndpoint:
    Description: Where applications send telemetry (with the ingest token). The application deploys read this.
    Value: !Sub https://${Distribution.DomainName}
  InstanceId:
    Value: !Ref Instance
  DeployRoleArn:
    Description: Set this as AWS_DEPLOY_ROLE_ARN on the GitHub "observability" environment.
    Value: !GetAtt DeployRole.Arn
  SetupLogs:
    Description: If setup ever fails, read the instance's boot output with this command.
    Value: !Sub aws ec2 get-console-output --region ${AWS::Region} --instance-id ${Instance} --latest --output text
