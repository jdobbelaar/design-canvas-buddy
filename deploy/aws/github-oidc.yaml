AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Lets GitHub Actions deploy design-canvas-buddy: an OIDC identity provider, a
  narrowly scoped deploy role that only one GitHub environment of the repository
  can assume, and an instance profile for the server so it can
  receive deploy commands through AWS Systems Manager (no SSH, no stored keys).

# One stack of this template per environment. Creating IAM resources needs
# administrator-level permissions that the day-to-day deploy user should not
# keep, so run these as an admin (or temporarily attach IAMFullAccess to that
# user, then detach it). Each environment also needs iam:PassRole for its own
# server role on that user, or the server cannot be launched with it.
#
# dev (also creates the account-wide GitHub OIDC provider; there can be only one):
#   aws cloudformation deploy --stack-name design-canvas-buddy-github \
#     --template-file deploy/aws/github-oidc.yaml --capabilities CAPABILITY_NAMED_IAM
#
# prod (reuses the provider; its own roles, trusted only by the production environment):
#   aws cloudformation deploy --stack-name design-canvas-buddy-github-prod \
#     --template-file deploy/aws/github-oidc.yaml --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides CreateOidcProvider=false NameSuffix=-prod \
#     ServerName=design-canvas-buddy-prod GitHubEnvironment=production \n#     AppStackName=design-canvas-buddy-prod
#
# Then start the app stack with that environment's profile and server name, e.g. prod:
#   aws cloudformation deploy --stack-name design-canvas-buddy-prod \
#     --template-file deploy/aws/cloudformation.yaml --parameter-overrides \
#     ServerName=design-canvas-buddy-prod InstanceProfileName=design-canvas-buddy-server-prod
#
# Finally, in GitHub, create an environment (dev / production) and give it the
# variables AWS_DEPLOY_ROLE_ARN (this stack's DeployRoleArn output) and STACK_NAME.

Parameters:
  NameSuffix:
    Type: String
    Default: ""
    Description: >-
      Appended to the IAM role and profile names so environments do not collide:
      empty for dev, -prod for production.

  ServerName:
    Type: String
    Default: design-canvas-buddy
    Description: >-
      The Name tag of this environment's server (the ServerName parameter of
      cloudformation.yaml). The deploy role can only send commands to servers
      carrying it.

  GitHubSubject:
    Type: String
    Default: repo:jdobbelaar@7696911/design-canvas-buddy@1363452304
    Description: >-
      The repository part of the token subject (the "sub" claim, before
      ":environment:..."). This repo has GitHub's immutable subject setting on, so it
      names the owner and repository by numeric id, which survives renames and
      transfers. Read it with: gh api repos/OWNER/REPO/actions/oidc/customization/sub
      (sub_claim_prefix). With the default setting it is repo:OWNER/REPO.

  GitHubEnvironment:
    Type: String
    Default: dev
    Description: Only workflow jobs running in this GitHub environment may assume the role.

  AppStackName:
    Type: String
    Default: design-canvas-buddy
    Description: The main stack (cloudformation.yaml) the pipeline deploys to.

  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Set to false if the account already has token.actions.githubusercontent.com.

Conditions:
  MakeProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub design-canvas-buddy-github-deploy${NameSuffix}
      Description: Assumed by GitHub Actions (OIDC) to deploy design-canvas-buddy.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeProvider
                - !Ref GitHubProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # Exactly this repository AND this environment. Nothing else
                # (forks, other branches, pull requests) can get credentials.
                token.actions.githubusercontent.com:sub: !Sub ${GitHubSubject}:environment:${GitHubEnvironment}
      Policies:
        - PolicyName: deploy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadStackOutputs
                Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: !Sub arn:${AWS::Partition}:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
              - Sid: RunTheShellDocument
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript
              - Sid: OnlyOnTheAppServer
                Effect: Allow
                Action: ssm:SendCommand
                Resource: !Sub arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/*
                Condition:
                  StringEquals:
                    ssm:resourceTag/Name: !Ref ServerName
              - Sid: ReadCommandResults
                Effect: Allow
                Action:
                  - ssm:GetCommandInvocation
                  - ssm:ListCommandInvocations
                  - ssm:DescribeInstanceInformation
                Resource: "*"

  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub design-canvas-buddy-server${NameSuffix}
      Description: Lets the server's SSM agent receive deploy commands.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub design-canvas-buddy-server${NameSuffix}
      Roles: [!Ref InstanceRole]

Outputs:
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
  InstanceProfileName:
    Description: Attach to the server (see the header of this file).
    Value: !Ref InstanceProfile
