auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  # OTLP resource attributes arrive as "structured metadata", which needs this.
  allow_structured_metadata: true
  retention_period: 168h
  otlp_config:
    resource_attributes:
      attributes_config:
        # service.name is indexed (as service_name) by default. Also index the
        # environment, so {deployment_environment_name="dev"} is a fast selector.
        # service.version is deliberately NOT an index label: it changes with
        # every deploy, and each new value would create new streams. It stays
        # available as structured metadata: {...} | service_version="<tag>".
        - action: index_label
          attributes:
            - deployment.environment.name

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

analytics:
  reporting_enabled: false
