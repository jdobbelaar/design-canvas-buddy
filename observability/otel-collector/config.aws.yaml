# The collector as deployed on AWS. Same pipelines as config.yaml, but only OTLP/HTTP
# is accepted and every request must carry the shared token:
#
#   Authorization: Bearer <token>
#
# Applications send it with OTEL_EXPORTER_OTLP_HEADERS (see deploy/aws/deploy.sh).
# The token comes from AWS Secrets Manager, through the INGEST_TOKEN variable.
# Requests without it are rejected with 401 before anything is read.

extensions:
  bearertokenauth:
    scheme: Bearer
    token: ${env:INGEST_TOKEN}

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
        auth:
          authenticator: bearertokenauth

processors:
  # Drop data rather than run out of memory if a store falls behind.
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64
  batch: {}

exporters:
  otlp_grpc/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  # The exporter appends /v1/metrics and /v1/logs to these base URLs.
  otlp_http/prometheus:
    endpoint: http://prometheus:9090/api/v1/otlp
  otlp_http/loki:
    endpoint: http://loki:3100/otlp

service:
  extensions: [bearertokenauth]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_grpc/tempo]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/loki]
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
