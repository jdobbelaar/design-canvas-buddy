global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Application metrics are not scraped: they are pushed over OTLP through the
# collector to Prometheus's OTLP receiver (--web.enable-otlp-receiver in
# docker-compose.yaml). What is scraped is the observability stack itself.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
  - job_name: otel-collector
    static_configs:
      - targets: [otel-collector:8888]
  - job_name: tempo
    static_configs:
      - targets: [tempo:3200]
  - job_name: loki
    static_configs:
      - targets: [loki:3100]

otlp:
  # OTLP metrics carry who produced them as *resource* attributes. Prometheus
  # keeps only service.name (as `job`) and service.instance.id (as `instance`) as
  # labels unless told to promote more, so list the ones worth filtering on. The
  # rest are still queryable through the target_info metric.
  promote_resource_attributes:
    - deployment.environment.name
    - service.version
