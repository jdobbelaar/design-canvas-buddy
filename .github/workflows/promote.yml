# Manually promotes the image currently deployed in dev to production.
#
#   Actions -> promote -> Run workflow (from main)
#
# It asks dev's public /health which image tag dev is serving, checks that dev is
# healthy and that the image is in the registry, then deploys that same image to
# production with deploy.yml (same steps, and the same required-reviewer
# approval on the production environment, as the automatic pipeline). Nothing is
# rebuilt: production runs the very image dev is running.
#
# This is deliberately "what dev runs right now", not "the latest main": if main
# has moved on since the last dev deploy, the newer image is not promoted.

name: promote

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  resolve:
    name: Find the image running in dev
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: dev
    permissions:
      id-token: write
      contents: read
    outputs:
      tag: ${{ steps.dev.outputs.tag }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
      IMAGE_NAME: design-canvas-buddy
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: promote-resolve-${{ github.run_id }}

      - name: Ask dev which image it is running
        id: dev
        env:
          STACK_NAME: ${{ vars.STACK_NAME }}
        run: |
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='AppUrl'].OutputValue" --output text)
          body=$(curl -sS --max-time 10 "$url/health" || true)
          echo "dev ($url) says: ${body:-<no response>}"

          jq -e '.status == "ok" and .database == "ok"' <<<"$body" > /dev/null \
            || { echo "::error::dev is not healthy; refusing to promote it"; exit 1; }
          tag=$(jq -r '.version' <<<"$body")
          [[ "$tag" =~ ^[0-9]{8}-[0-9]{6}-[0-9a-f]{7}$ ]] \
            || { echo "::error::dev reports '$tag', not an image tag (has the pipeline deployed dev yet?)"; exit 1; }

          # Only images the pipeline built, tested and pushed exist in the
          # registry, so this is also the check that the image is a real release.
          aws ecr describe-images --repository-name "$IMAGE_NAME" --image-ids "imageTag=$tag" > /dev/null \
            || { echo "::error::image $tag is not in the registry"; exit 1; }

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Promoting image $tag from dev to production." >> "$GITHUB_STEP_SUMMARY"

  production:
    name: Deploy to production
    needs: resolve
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.resolve.outputs.tag }}
    permissions:
      id-token: write
      contents: read
    # Shared with the automatic pipeline: never two production deploys at once.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
