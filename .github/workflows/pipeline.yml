# CI/CD: test -> test the built Docker Compose stack -> deploy to AWS -> verify.
#
#   backend-tests ─┐
#   frontend-tests ┼─> integration-tests ─┐
#   template-checks┘    e2e-tests ─────────┴─> deploy-dev -> deploy-production (needs approval)
#
# Deploying needs one-time AWS setup per environment: see deploy/aws/github-oidc.yaml.
#
# Actions are pinned to full commit SHAs (the comment names the release).

name: pipeline

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch/PR supersedes a run that is still testing.
# (Deploys have their own, non-cancelling group below.)
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---- Stage 1: fast checks, all in parallel --------------------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The suite runs against SQLite by default; a real Postgres catches what
      # SQLite can't (e.g. the stacking-order bug that only Postgres exposed).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dcb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: pytest (SQLite)
        run: uv run pytest
      - name: pytest (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/dcb_test
        run: uv run pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  template-checks:
    name: Lint CloudFormation and deploy script
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: cfn-lint
        run: uvx cfn-lint deploy/aws/cloudformation.yaml deploy/aws/github-oidc.yaml
      - name: shellcheck
        run: shellcheck deploy/aws/deploy.sh

  # ---- Stage 2: the real Docker Compose stack -------------------------------
  # Each job builds the image itself (GIT_SHA is baked in and reported by
  # /health) and runs against its own throwaway stack.
  integration-tests:
    name: Integration tests (Docker Compose)
    needs: [backend-tests, frontend-tests, template-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GIT_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest integration_tests -v
        working-directory: backend

  e2e-tests:
    name: End-to-end tests (Playwright, Docker Compose)
    needs: [backend-tests, frontend-tests, template-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GIT_SHA: ${{ github.sha }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      # --with-deps also installs the system libraries the browsers need.
      - run: npx playwright install --with-deps
      - name: Playwright (Chromium, Firefox, WebKit)
        run: npm run test:all-browsers
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---- Stage 3: deploy and verify, dev first --------------------------------
  # Only pushes to main deploy. Each job runs deploy.yml against one GitHub
  # environment (see there); production additionally waits for a reviewer to
  # approve, configured on that environment in the repository settings.
  deploy-dev:
    name: Deploy to dev
    needs: [integration-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
    permissions:
      id-token: write
      contents: read
    # Never run two deploys to one environment at once, or cancel one half-way.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

  deploy-production:
    name: Deploy to production
    needs: deploy-dev
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
