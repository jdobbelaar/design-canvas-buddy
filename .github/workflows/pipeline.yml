# CI/CD: test -> build one image -> test that image -> push it to ECR -> deploy it.
#
#   backend-tests ──┐
#   frontend-tests ─┤
#   template-checks ┼─> integration-tests ─┐
#   build-image ────┘    e2e-tests ─────────┴─> publish-image -> deploy-dev -> deploy-production (approval)
#
# The image is built once (build-image), the integration and end-to-end tests run
# against that very image, and only if they pass is it pushed to the registry
# (publish-image) and deployed. The servers pull it; nothing is built there.
# Production runs the same image dev did, never a rebuild of it.
#
# Deploying needs one-time AWS setup: see deploy/aws/github-oidc.yaml (per
# environment) and deploy/aws/registry.yaml (once).
#
# Actions are pinned to full commit SHAs (the comment names the release).

name: pipeline

on:
  push:
    branches: [main]
  pull_request:

# A newer push to a pull request supersedes a run that is still testing. On main
# runs are never cancelled, so a push cannot kill a deploy half-way through.
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_NAME: design-canvas-buddy

permissions:
  contents: read

jobs:
  # ---- Stage 1: fast checks, all in parallel --------------------------------
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # The suite runs against SQLite by default; a real Postgres catches what
      # SQLite can't (e.g. the stacking-order bug that only Postgres exposed).
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: dcb_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: pytest (SQLite)
        run: uv run pytest
      - name: pytest (Postgres)
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:test@localhost:5432/dcb_test
        run: uv run pytest

  frontend-tests:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test

  template-checks:
    name: Lint infrastructure files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      - name: cfn-lint
        run: uvx cfn-lint deploy/aws/cloudformation.yaml deploy/aws/github-oidc.yaml
      - name: shellcheck
        run: shellcheck deploy/aws/deploy.sh
      # The local observability stack: the Compose files parse, and the
      # collector accepts its config (it rejects unknown components and typos).
      - name: Compose files
        run: |
          docker compose -f docker-compose.yaml config --quiet
          docker compose -f observability/docker-compose.yaml config --quiet
      - name: OpenTelemetry Collector config
        run: |
          docker run --rm -v "$PWD/observability/otel-collector/config.yaml:/etc/otelcol/config.yaml:ro"             otel/opentelemetry-collector:0.161.0 validate --config=/etc/otelcol/config.yaml

  # The image every later stage uses, built exactly once. Its tag is
  # YYYYMMDD-HHMMSS-shortsha (UTC build time, then the commit).
  build-image:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Work out the tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d-%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker build --build-arg "APP_VERSION=$TAG" --tag "$IMAGE_NAME:$TAG" .
      - name: Save the image for the jobs that test and publish it
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: docker save "$IMAGE_NAME:$TAG" | gzip -1 > image.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image
          path: image.tar.gz
          compression-level: 0 # already gzipped
          retention-days: 3

  # ---- Stage 2: the built image, run as a real Docker Compose stack ---------
  # Both jobs load the image built above and run docker-compose.yaml against it
  # (APP_IMAGE makes compose use it instead of building), so what is tested is
  # byte-for-byte what gets shipped.
  integration-tests:
    name: Integration tests (Docker Compose)
    needs: [backend-tests, frontend-tests, template-checks, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_IMAGE: design-canvas-buddy:${{ needs.build-image.outputs.tag }}
      APP_VERSION: ${{ needs.build-image.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
        working-directory: backend
      - run: uv run pytest integration_tests -v
        working-directory: backend

  e2e-tests:
    name: End-to-end tests (Playwright, Docker Compose)
    needs: [backend-tests, frontend-tests, template-checks, build-image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APP_IMAGE: design-canvas-buddy:${{ needs.build-image.outputs.tag }}
      APP_VERSION: ${{ needs.build-image.outputs.tag }}
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
          path: ${{ github.workspace }}
      - run: gunzip -c "$GITHUB_WORKSPACE/image.tar.gz" | docker load
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      # --with-deps also installs the system libraries the browsers need.
      - run: npx playwright install --with-deps
      - name: Playwright (Chromium, Firefox, WebKit)
        run: npm run test:all-browsers
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          if-no-files-found: ignore
          retention-days: 7

  # ---- Stage 3: push the tested image to the registry (main only) -----------
  publish-image:
    name: Push image to ECR
    needs: [build-image, integration-tests, e2e-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      id-token: write # request the OIDC token exchanged for AWS credentials
      contents: read
    outputs:
      tag: ${{ needs.build-image.outputs.tag }}
    env:
      TAG: ${{ needs.build-image.outputs.tag }}
      AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: image
      - run: gunzip -c image.tar.gz | docker load
      # The build role trusts only this repository's main branch (registry.yaml).
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_BUILD_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: publish-${{ github.run_id }}
      - name: Push
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          registry="$account.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login --username AWS --password-stdin "$registry"
          docker tag "$IMAGE_NAME:$TAG" "$registry/$IMAGE_NAME:$TAG"
          docker push "$registry/$IMAGE_NAME:$TAG"
          echo "Pushed $registry/$IMAGE_NAME:$TAG" >> "$GITHUB_STEP_SUMMARY"

  # ---- Stage 4: deploy that image, dev first --------------------------------
  # Each job runs deploy.yml against one GitHub environment (see there);
  # production additionally waits for a reviewer to approve, configured on that
  # environment in the repository settings.
  deploy-dev:
    name: Deploy to dev
    needs: publish-image
    uses: ./.github/workflows/deploy.yml
    with:
      environment: dev
      image_tag: ${{ needs.publish-image.outputs.tag }}
    permissions:
      id-token: write
      contents: read
    # Never run two deploys to one environment at once, or cancel one half-way.
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

  deploy-production:
    name: Deploy to production
    needs: [publish-image, deploy-dev]
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
      image_tag: ${{ needs.publish-image.outputs.tag }}
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: deploy-production
      cancel-in-progress: false
